name: Bug report
description: Báo lỗi plugin KoraPayments
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: KoraPayments version
      placeholder: "1.3.1"
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Server software/version
      placeholder: "Paper 1.21.1 / Folia ..."
    validations:
      required: true
  - type: input
    id: java
    attributes:
      label: Java version
      placeholder: "Java 17 / Java 21"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Khu vực lỗi
      options:
        - Nạp bank
        - Nạp thẻ
        - Mốc nạp
        - Discord webhook
        - Discord Auto Buy
        - PlaceholderAPI
        - GUI/Commands
        - Khác
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Mô tả lỗi
      description: Mô tả rõ lỗi xảy ra thế nào.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Các bước tái hiện
      placeholder: |
        1. Chạy lệnh ...
        2. Nhập ...
        3. Lỗi xuất hiện ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log liên quan
      description: Che token/API key/webhook trước khi gửi.
      render: text
